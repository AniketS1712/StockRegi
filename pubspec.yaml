name: stockregi
description: "StockRegi - Inventory and POS management application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  google_fonts: ^8.2.1
  go_router: ^17.5.0
  flutter_riverpod: ^2.6.1
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FBF9F8"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#FBF9F8"
    theme_color: "#426447"

flutter_native_splash:
  color: "#FBF9F8"
  image: assets/images/app_logo.png
  android_12:
    image: assets/images/app_logo.png
    color: "#FBF9F8"
  web: false
